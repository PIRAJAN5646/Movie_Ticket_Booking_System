<header class="header">
  <div class="header-inner">

    <!-- Logo -->
    <a routerLink="/" class="logo">
      <div class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="4" width="20" height="16" rx="3" fill="#e50914"/>
          <path d="M8 9l8 3-8 3V9z" fill="white"/>
          <rect x="2" y="7" width="2" height="2" fill="white" opacity="0.6"/>
          <rect x="2" y="11" width="2" height="2" fill="white" opacity="0.6"/>
          <rect x="2" y="15" width="2" height="2" fill="white" opacity="0.6"/>
          <rect x="20" y="7" width="2" height="2" fill="white" opacity="0.6"/>
          <rect x="20" y="11" width="2" height="2" fill="white" opacity="0.6"/>
          <rect x="20" y="15" width="2" height="2" fill="white" opacity="0.6"/>
        </svg>
      </div>
      <span class="logo-text">CineBook</span>
    </a>

    <!-- Search -->
    <div class="search-wrap">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input class="search-input" type="text" placeholder="Search movies, events, plays, sports..." />
    </div>

    <!-- Nav -->
    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-link">Movies</a>
      <a href="#" class="nav-link">Stream</a>
      <a href="#" class="nav-link">Events</a>
      <a href="#" class="nav-link">Plays</a>
      <a href="#" class="nav-link">Sports</a>
    </nav>

    <!-- Right -->
    <div class="header-right">

      <!-- City selector -->
      <div class="city-btn-wrap">
        <button class="city-btn" (click)="toggleCityDropdown($event)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
          </svg>
          {{ city() }}
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            [style.transform]="showCityDropdown() ? 'rotate(180deg)' : 'rotate(0deg)'"
            style="transition:transform 0.2s">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

        @if (showCityDropdown()) {
          <div class="city-dropdown">
            @for (c of cities; track c) {
              <div class="city-option" [class.active]="c === city()" (click)="selectCity(c)">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                </svg>
                {{ c }}
              </div>
            }
          </div>
        }
      </div>

      <!-- Auth section -->
      @if (auth.isLoggedIn()) {
        <div class="user-menu-wrap">

          <!-- Wallet badge -->
          <div class="wallet-badge" title="CineBook Wallet">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
              <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
              <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
            </svg>
            {{ walletDisplay }}
          </div>

          <!-- User button -->
          <button class="user-btn" (click)="toggleUserMenu($event)">
            <span class="user-avatar">{{ auth.currentUser()?.name?.[0] ?? 'U' }}</span>
            <span class="user-name">{{ (auth.currentUser()?.name ?? '').split(' ')[0] }}</span>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              [style.transform]="showUserMenu() ? 'rotate(180deg)' : 'rotate(0deg)'"
              style="transition:transform 0.2s">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>

          @if (showUserMenu()) {
            <div class="user-dropdown">
              <div class="dropdown-wallet">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#e50914" stroke-width="2">
                  <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
                </svg>
                <div>
                  <div class="dropdown-wallet-label">CineBook Wallet</div>
                  <div class="dropdown-wallet-amount">{{ walletDisplay }}</div>
                </div>
              </div>
              <div class="dropdown-divider"></div>
              <a routerLink="/my-bookings" class="dropdown-item">My Bookings</a>
              <a routerLink="/signin" class="dropdown-item">Account Settings</a>
              <div class="dropdown-divider"></div>
              <button class="dropdown-item logout-item" (click)="logout()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Sign Out
              </button>
            </div>
          }
        </div>
      } @else {
        <a routerLink="/signin" class="btn-signin">Sign In</a>
      }

    </div>
  </div>
</header>
