<div class="stream-card">
  <div class="img-wrap">
    <img [src]="stream?.imageUrl" [alt]="stream?.title" loading="lazy" />
    @if (stream?.badge) {
      <span class="stream-badge">{{ stream.badge }}</span>
    }
    <div class="stream-overlay">
      <span class="play-btn">▶</span>
    </div>
  </div>
  <div class="stream-info">
    <p class="stream-title">{{ stream?.title }}</p>
    <p class="stream-platform">{{ stream?.platform }}</p>
  </div>
</div>
